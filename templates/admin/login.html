<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | UK Events</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        @supports (-webkit-backdrop-filter: none) or (backdrop-filter: none) {
            .glass {
                background: rgba(255, 255, 255, 0.8);
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-slate-50 p-4 sm:p-6 lg:p-8">
    <!-- Animated Background Gradients -->
    <div class="fixed inset-0 z-[-1] overflow-hidden">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-blue-200/50 blur-[100px]"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] rounded-full bg-purple-200/50 blur-[100px]"></div>
    </div>

    <div class="w-full max-w-md">
        <!-- Logo/Brand Section -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl shadow-lg shadow-blue-200 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight sm:text-3xl">UK Events</h1>
            <p class="text-slate-500 mt-2 font-medium">Administration Portal</p>
        </div>

        <!-- Login Card -->
        <div class="glass p-6 sm:p-10 rounded-3xl shadow-xl shadow-slate-200/50 border border-white">
            <h2 class="text-xl font-semibold text-slate-800 mb-2">Welcome back</h2>
            <p class="text-sm text-slate-500 mb-8">Please enter your credentials to continue.</p>

            {% if error %}
            <div class="flex items-center gap-3 bg-red-50 border border-red-100 text-red-700 p-4 rounded-xl mb-6 text-sm animate-pulse">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
                </svg>
                <p>{{ error }}</p>
            </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}
                
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5 ml-1">Username</label>
                    <div class="relative">
                        <input type="text" name="username" id="username" placeholder="Enter your username" required
                            class="w-full bg-white/50 border border-slate-200 rounded-xl px-4 py-3.5 outline-none transition-all focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 placeholder:text-slate-400">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5 ml-1">Password</label>
                    <div class="relative">
                        <input type="password" name="password" id="password" placeholder="••••••••" required
                            class="w-full bg-white/50 border border-slate-200 rounded-xl px-4 py-3.5 outline-none transition-all focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 placeholder:text-slate-400">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="group relative w-full bg-slate-900 hover:bg-slate-800 text-white py-4 rounded-xl font-bold text-base transition-all active:scale-[0.98] shadow-lg shadow-slate-200">
                        Sign In
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 inline-block ml-2 transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <p class="text-center text-slate-400 text-xs mt-8">
            &copy; 2024 UK Events Ltd. All rights reserved.
        </p>
    </div>
</body>
</html>
