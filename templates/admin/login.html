<!DOCTYPE html>
<html>
<head>
  <title>Admin Login | UK Events</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 to-purple-600">

<div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl">
  <h2 class="text-3xl font-bold text-center mb-6">UK Events Admin</h2>

  {% if error %}
    <p class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm">
      {{ error }}
    </p>
  {% endif %}

  <form method="post">
    {% csrf_token %}

    <input type="text" name="username" placeholder="Username"
      class="w-full mb-4 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">

    <input type="password" name="password" placeholder="Password"
      class="w-full mb-6 p-3 border rounded-lg focus:ring-2 focus:ring-blue-500">

    <button
      class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold transition">
      Login
    </button>
  </form>
</div>

</body>
</html>
