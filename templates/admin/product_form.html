<!DOCTYPE html>
<html>
<head>
  <title>Add Product | Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white w-full max-w-xl p-8 rounded-2xl shadow-xl">

  <h2 class="text-2xl font-bold mb-6">Add New Product</h2>

  <form method="post" enctype="multipart/form-data" class="space-y-4">
    {% csrf_token %}

    <input
      name="name"
      placeholder="Product Name"
      class="input"
      required
    >

    <input
      name="category"
      placeholder="Category"
      class="input"
      required
    >

    <textarea
      name="description"
      placeholder="Description"
      class="input"
      rows="3"
      required
    ></textarea>

    <input
      name="price"
      type="number"
      step="0.01"
      placeholder="Price"
      class="input"
      required
    >

    <!-- Mobile-friendly image upload -->
    <input
      type="file"
      name="image"
      accept="image/*"
      capture="environment"
      required
    >

    <button
      class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-semibold">
      Save Product
    </button>
  </form>

</div>

<style>
  .input {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ccc;
    border-radius: 0.5rem;
  }
</style>

</body>
</html>
