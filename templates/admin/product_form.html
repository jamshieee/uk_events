<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if product %}Edit Product{% else %}Add Product{% endif %} | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Smooth scale-down for mobile buttons */
        .active-scale:active { transform: scale(0.97); }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 md:p-10">

<div class="bg-white w-full max-w-xl p-6 sm:p-8 md:p-10 rounded-2xl sm:rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 my-auto">

    <!-- Header -->
    <div class="mb-6 md:mb-8">
        <a href="{% url 'admin-products' %}" class="inline-flex items-center text-xs sm:text-sm font-bold text-indigo-600 mb-4 bg-indigo-50 px-3 py-1.5 rounded-lg transition-all hover:bg-indigo-100">
            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Back to Inventory
        </a>
        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
            {% if product %} Edit Product {% else %} New Product {% endif %}
        </h2>
        <p class="text-slate-500 mt-1 text-sm sm:text-base">Enter the item details for the event catalog.</p>
    </div>

    <form method="post" enctype="multipart/form-data" class="space-y-5 md:space-y-6">
        {% csrf_token %}

        <!-- Name Input -->
        <div class="space-y-1.5">
            <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-tight">Product Name</label>
            <input
                name="name"
                value="{{ product.name|default:'' }}"
                placeholder="e.g. Premium Stage Lighting"
                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-300 text-sm sm:text-base"
                required
            >
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Category Input -->
            <div class="space-y-1.5">
                <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-tight">Category</label>
                <input
                    name="category"
                    value="{{ product.category|default:'' }}"
                    placeholder="e.g. Audio/Visual"
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-300 text-sm sm:text-base"
                    required
                >
            </div>

            <!-- Price Input -->
            <div class="space-y-1.5">
                <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-tight">Price (₹)</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-sm">₹</span>
                    <input
                        name="price"
                        type="number"
                        step="0.01"
                        value="{{ product.price|default:'' }}"
                        placeholder="0.00"
                        class="w-full pl-8 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-300 text-sm sm:text-base"
                        required
                    >
                </div>
            </div>
        </div>

        <!-- Description Textarea -->
        <div class="space-y-1.5">
            <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-tight">Description</label>
            <textarea
                name="description"
                placeholder="Briefly describe the product features..."
                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-300 text-sm sm:text-base min-h-[100px]"
                rows="3"
                required
            >{{ product.description|default:'' }}</textarea>
        </div>

        <!-- Image Management -->
        <div class="p-4 sm:p-5 bg-slate-50 rounded-2xl border border-slate-200 border-dashed space-y-4">
            <label class="block text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-tight">Visual Asset</label>
            
            {% if product and product.image %}
                <div class="flex items-center space-x-3 p-2.5 bg-white rounded-xl border border-slate-100 shadow-sm">
                    <img src="{{ product.image.url }}" class="h-14 w-14 rounded-lg object-cover">
                    <div class="min-w-0">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Current</p>
                        <p class="text-[10px] text-slate-500 truncate max-w-[120px] sm:max-w-[200px]">{{ product.image.name }}</p>
                    </div>
                </div>
            {% endif %}

            <div class="relative group">
                <input
                    type="file"
                    name="image"
                    accept="image/*"
                    capture="environment"
                    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                    {% if not product %} required {% endif %}
                    onchange="document.getElementById('file-name').textContent = this.files[0].name"
                >
                <div class="flex flex-col items-center justify-center py-6 px-4 bg-white border border-slate-200 rounded-xl group-hover:border-indigo-400 transition-colors text-center">
                    <div class="bg-indigo-50 p-2 rounded-full mb-2">
                        <svg class="w-6 h-6 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                    </div>
                    <p id="file-name" class="text-xs font-bold text-slate-600 line-clamp-1 px-2">
                        Tap to upload product photo
                    </p>
                </div>
            </div>
        </div>

        <!-- Submit Button -->
        <button
            class="active-scale w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl sm:rounded-2xl font-bold shadow-lg shadow-indigo-200 transition-all flex items-center justify-center space-x-2 text-sm sm:text-base">
            <span>
                {% if product %} Update Information {% else %} Save Product {% endif %}
            </span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </button>
    </form>

</div>

<footer class="mt-8 text-center text-slate-400 text-[10px] font-bold uppercase tracking-widest">
    UK Events Admin
</footer>

</body>
</html>
