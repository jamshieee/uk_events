<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if product %}Edit Product{% else %}Add Product{% endif %} | Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .active-scale:active { transform: scale(0.97); }
    </style>
</head>

<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 md:p-10">

<div class="bg-white w-full max-w-xl p-6 sm:p-8 md:p-10 rounded-2xl shadow-xl border border-slate-100 my-auto">

    <!-- HEADER -->
    <div class="mb-8">
        <a href="{% url 'admin-products' %}"
           class="inline-flex items-center text-sm font-bold text-indigo-600 mb-4 bg-indigo-50 px-3 py-1.5 rounded-lg hover:bg-indigo-100">
            ← Back to Inventory
        </a>

        <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">
            {% if product %} Edit Product {% else %} New Product {% endif %}
        </h2>
        <p class="text-slate-500 mt-1 text-sm">
            Enter product details for the event catalog
        </p>
    </div>

    <!-- FORM -->
    <form method="post" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}

        <!-- NAME -->
        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase">Product Name</label>
            <input
                name="name"
                value="{{ product.name|default:'' }}"
                required
                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none"
            >
        </div>

        <!-- CATEGORY & PRICE -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase">Category</label>
                <input
                    name="category"
                    value="{{ product.category|default:'' }}"
                    required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/10"
                >
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase">Price (₹)</label>
                <input
                    name="price"
                    type="number"
                    step="0.01"
                    value="{{ product.price|default:'' }}"
                    required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/10"
                >
            </div>
        </div>

        <!-- DESCRIPTION -->
        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase">Description</label>
            <textarea
                name="description"
                rows="3"
                required
                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/10"
            >{{ product.description|default:'' }}</textarea>
        </div>

        <!-- MAIN IMAGE -->
        <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
            <label class="block text-xs font-bold text-slate-700 uppercase mb-2">
                Main Product Image
            </label>

            {% if product and product.image %}
                <img src="{{ product.image.url }}" class="h-24 w-24 rounded-lg object-cover mb-3 border">
            {% endif %}

            <input
                type="file"
                name="image"
                accept="image/*"
                class="block w-full text-sm text-slate-500
                       file:mr-4 file:py-2 file:px-4
                       file:rounded-lg file:border-0
                       file:bg-indigo-50 file:text-indigo-700
                       hover:file:bg-indigo-100"
            >
        </div>

        <!-- GALLERY IMAGES -->
        <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 border-dashed">
            <label class="block text-xs font-bold text-slate-700 uppercase mb-2">
                Product Gallery Images (Multiple)
            </label>

            <input
                type="file"
                name="gallery_images"
                multiple
                accept="image/*"
                class="block w-full text-sm text-slate-500
                       file:mr-4 file:py-2 file:px-4
                       file:rounded-lg file:border-0
                       file:bg-green-50 file:text-green-700
                       hover:file:bg-green-100"
            >

            {% if product %}
                <div class="grid grid-cols-4 gap-3 mt-4">
                    {% for img in product.gallery.all %}
                        <img src="{{ img.image.url }}"
                             class="h-20 w-20 object-cover rounded-lg border">
                    {% endfor %}
                </div>
            {% endif %}
        </div>

        <!-- SUBMIT -->
        <button
            class="active-scale w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl font-bold shadow-lg transition">
            {% if product %} Update Product {% else %} Save Product {% endif %}
        </button>

    </form>
</div>

<footer class="mt-8 text-slate-400 text-xs font-bold uppercase tracking-widest">
    UK Events Admin
</footer>

</body>
</html>
